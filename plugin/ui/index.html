<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReaCut</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#111216;color:#e8e8ed;font:12px system-ui}body{display:flex;flex-direction:column}header{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:9px 12px;background:#1b1c21;border-bottom:1px solid #303139}b{font-size:14px;color:#57dec5;margin-right:8px}button,input{font:inherit;color:inherit;background:#292b32;border:1px solid #3c3f47;border-radius:5px;padding:6px 9px}button{cursor:pointer}button:hover{background:#3a3d47}button:focus-visible,input:focus-visible{outline:2px solid #57dec5}#status{margin-left:auto;color:#aaa;font-size:11px}#stage{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center}#screen{display:block;width:auto;height:auto;max-width:100%;max-height:100%;outline:none;touch-action:none;user-select:none}#stage.original{display:block}#stage.original #screen{width:1440px;max-width:none;max-height:none}footer{padding:7px 12px;border-top:1px solid #303139;background:#1b1c21}form{display:flex;gap:8px;align-items:center}input{min-width:100px;flex:1}small{display:block;margin-top:5px;color:#9fa2af}#screen:not([src]){min-height:200px} 
</style></head><body><header><b>ReaCut</b><button data-menu="import">导入素材</button><button data-menu="open">打开项目</button><button data-menu="save">保存</button><button data-menu="export">导出</button><button id="zoom">100%</button><button id="desktop">显示桌面窗口</button><span id="status">连接编辑器…</span></header><main id="stage"><img id="screen" tabindex="0" alt="ReaCut 编辑器实时画面，可点击、拖动和使用键盘操作" draggable="false"></main><footer><form id="typing"><label for="text">中文 / 粘贴</label><input id="text" placeholder="先点击编辑器中的文本框，再输入并发送" maxlength="12000"><button type="submit">发送文字</button></form><small>文件选择与保存会打开系统对话框。声音由本机 ReaCut 播放；侧栏画面约 6 帧/秒，精细预览可显示桌面窗口。</small></footer><script type="module">/*__SCRIPT__*/</script></body></html>
